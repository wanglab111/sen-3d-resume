# 构建 dist 并发布到 GitHub Pages。
# 触发：推到 main 分支时自动跑；也可以在 Actions 页手动点 "Run workflow"。
#
# 前置（仓库里做一次即可）：
#   Settings → Pages → Source 选 "GitHub Actions"
#
# 注意：本仓库的 public/site1 下有两套帧序列（约 14MB），构建产物约 25MB，
#   GitHub Pages 的单站软上限是 1GB，够用；但每次 push 都会重新构建，别频繁乱推。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，后来的排队而不是互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci 而不是 npm install：严格按 package-lock 装，版本可复现
      - run: npm ci

      # build = `tsc -b && vite build`：会先做类型检查，类型不过就不发版
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
